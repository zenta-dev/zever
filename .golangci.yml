version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zenta-dev/zever

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - usetesting
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        # shared/codec can use v2/jsontext
        codec-facade:
          files:
            - "shared/codec/**/*.go"
          allow:
            - "encoding/json/v2"
            - "encoding/json/jsontext"
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
            - pkg: "encoding/json"
              desc: "Use shared/codec facade instead of encoding/json directly."
        # Deny only pkg/errors and io/ioutil for now; encoding/json deny added in final workstream
        main:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: false
      package-scope-only: false
    govet:
      enable:
        - shadow
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - contextcheck
