version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zenta-dev/zever

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - usetesting
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - zerologlint
  # wrapcheck is intentionally not enabled. Measured with
  # `golangci-lint run --enable-only wrapcheck ./...` per module (non-test
  # code, re-measured with --tests=false): config is clean, but container
  # (17) plus 40+ core/* modules (145) report 162 hits in total, well over
  # the ~25 that would make a scoped container + core/* enablement cheap. Most are deliberate pass-throughs of
  # adapter/interface errors (Close/Stop/Shutdown probes, registry
  # Register, ctx.Err) that callers match with errors.Is/As and that
  # already carry the adapter's own message prefix; wrapping them all adds
  # stutter without information. The repo's error conventions (message
  # prefixes, no double %w, no stray panics) are enforced by
  # `make err-lint` (tools/errscan) instead; see
  # docs/src/content/docs/reference/errors.mdx.
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
            # Exact match (trailing $): v1 only. encoding/json/v2 and
            # encoding/json/jsontext stay allowed: shared/codec is built on
            # them and migrated tests may reference jsontext.Value directly.
            - pkg: "encoding/json$"
              desc: "Use shared/codec facade instead of encoding/json directly."
        # The framework has no config-file parser on purpose: v0.8.0 is
        # env-only. A test may parse a generated YAML document (the CLI
        # tests parse the GitHub Actions workflow it scaffolds), but no
        # non-test file may import a YAML, TOML, INI or properties package.
        # That import would be the first step back to file-based
        # configuration, so the gate stops it there. The rule covers the
        # whole tree; the same deny-list lives in tools/tagcheck as the
        # no_config_parser rule, which fails `make check-tags` with file
        # and line.
        no-yaml:
          files:
            - "!$test"
          deny:
            - pkg: "go.yaml.in/yaml"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "gopkg.in/yaml.v2"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "gopkg.in/yaml.v3"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "sigs.k8s.io/yaml"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "github.com/BurntSushi/toml"
              desc: "The framework is env-only: no non-test file may parse TOML"
            - pkg: "github.com/pelletier/go-toml"
              desc: "The framework is env-only: no non-test file may parse TOML"
            - pkg: "gopkg.in/ini.v1"
              desc: "The framework is env-only: no non-test file may parse INI"
            - pkg: "github.com/go-ini/ini"
              desc: "The framework is env-only: no non-test file may parse INI"
            - pkg: "github.com/magiconair/properties"
              desc: "The framework is env-only: no non-test file may parse Java-style properties"
        # shared/codec is the ONLY package allowed to import encoding/json/v2
        # and encoding/json/jsontext directly in NON-TEST code. All other
        # packages must use the shared/codec facade. Tests may still import
        # v2, but only to pin exact engine bytes or options (with a comment
        # saying so); the jsonv2-facade rule below enforces the non-test
        # side. (This is the W9 tightening this comment anticipated.)
        codec-facade:
          files:
            - "shared/codec/**/*.go"
          allow:
            - "encoding/json/v2"
            - "encoding/json/jsontext"
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
            - pkg: "encoding/json"
              desc: "Use shared/codec facade instead of encoding/json directly."
        # All JSON goes through shared/codec (built on encoding/json/v2):
        # non-test code outside shared/codec must not import
        # encoding/json/v2 directly. encoding/json/jsontext stays allowed
        # repo-wide: it is a data type (jsontext.Value fields/params in
        # ~46 files), not an engine entry point. Verified empirically with
        # golangci-lint v2.14.0: `files` positives and negations combine
        # as (no positives OR matches a positive) AND matches no
        # negation, and analyzed filenames are absolute, so the
        # shared/codec exclusion needs a leading `**` (a bare
        # `shared/codec/**` never matches and shared/codec itself
        # would fire). ["!$test", "!**/shared/codec/**"] therefore
        # scopes this rule to non-test files outside shared/codec
        # (shared/codec itself still passes, and a v2 import planted
        # in another module's non-test file fires).
        jsonv2-facade:
          files:
            - "!$test"
            - "!**/shared/codec/**"
          deny:
            - pkg: "encoding/json/v2"
              desc: "Use the shared/codec facade instead of encoding/json/v2 directly (allowed only in shared/codec; tests pinning exact engine bytes/options must say so in a comment)."
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: false
      package-scope-only: false
    govet:
      enable:
        - shadow
    gosec:
      # Curated security rules: run only high-confidence, actionable checks.
      # The allow-list key is `includes`: gosec settings never had an
      # `enable` key (v2.14 and v2.15 alike), so `enable:` was silently
      # ignored and gosec ran every default rule instead of this list.
      # IDs not listed here are skipped, for rules and analyzers alike,
      # which is also how the G7xx taint analyzers stay off (see G703).
      # Excluded false-positive-heavy rules:
      #  G103: unsafe in generated protobuf code
      #  G104: unhandled errors (often intentional pass-through)
      #  G109-G114: strconv unchecked (validated at boundaries)
      #  G115: integer overflow (bounds-checked at call sites)
      #  G204: subprocess launch (CLI tools, validated adapters)
      #  G301/G302/G306: file perms (CLI scaffolds, non-secret files)
      #  G402: TLS InsecureSkipVerify (explicit opt-in for testing)
      #  G404: weak random (retry/pruner jitter, non-security)
      #  G703: taint analysis (high FP rate on validated paths)
      includes:
        - G101  # hardcoded credentials
        - G102  # bind to all interfaces
        - G106  # ssh.InsecureIgnoreHostKey
        - G107  # URL taint to HTTP request
        - G108  # profiling endpoint exposed
        - G201  # SQL string concatenation
        - G202  # SQL string concatenation
        - G203  # unchecked SQL parameter
        - G303  # predictable tempfile
        - G305  # zip path traversal
        - G307  # temp file permissions
        - G401  # weak crypto
        - G403  # weak crypto min key size
        - G501  # import blacklist
        - G502  # import blacklist
        - G503  # import blacklist
        - G504  # import blacklist
        - G505  # import blacklist
        - G601  # implicit memory aliasing
      # Fail closed on bare suppressions: every #nosec must name a rule ID
      # and carry a `-- reason` (gosec v2.29+, surfaced via golangci v2.15).
      # This covers #nosec only; //nolint:gosec directives keep their
      # inline reasons by convention, enforced in review.
      config:
        global:
          nosec-require-rules: true
          nosec-require-justification: true
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - contextcheck