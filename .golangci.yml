version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/zenta-dev/zever

linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - dupl
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - usetesting
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        # shared/codec can use v2/jsontext
        codec-facade:
          files:
            - "shared/codec/**/*.go"
          allow:
            - "encoding/json/v2"
            - "encoding/json/jsontext"
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
            - pkg: "encoding/json"
              desc: "Use shared/codec facade instead of encoding/json directly."
        # The framework has no config-file parser on purpose: v0.8.0 is
        # env-only. A test may parse a generated YAML document (the CLI
        # tests parse the GitHub Actions workflow it scaffolds), but no
        # non-test file may import a YAML, TOML, INI or properties package.
        no-yaml:
          files:
            - "!$test"
          deny:
            - pkg: "go.yaml.in/yaml"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "gopkg.in/yaml.v2"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "gopkg.in/yaml.v3"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "sigs.k8s.io/yaml"
              desc: "The framework is env-only: no non-test file may parse YAML"
            - pkg: "github.com/BurntSushi/toml"
              desc: "The framework is env-only: no non-test file may parse TOML"
            - pkg: "github.com/pelletier/go-toml"
              desc: "The framework is env-only: no non-test file may parse TOML"
            - pkg: "gopkg.in/ini.v1"
              desc: "The framework is env-only: no non-test file may parse INI"
            - pkg: "github.com/go-ini/ini"
              desc: "The framework is env-only: no non-test file may parse INI"
            - pkg: "github.com/magiconair/properties"
              desc: "The framework is env-only: no non-test file may parse Java-style properties"
                # Deny only pkg/errors and io/ioutil for now; encoding/json deny added in final workstream
        main:
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "Use the standard library errors and fmt.Errorf(%w) instead of pkg/errors"
            - pkg: "io/ioutil"
              desc: "Deprecated since Go 1.16: use io or os instead"
    errorlint:
      errorf: true
    exhaustive:
      default-signifies-exhaustive: false
      package-scope-only: false
    govet:
      enable:
        - shadow
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - contextcheck
