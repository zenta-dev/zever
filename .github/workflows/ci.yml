name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted with gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_TOTAL: 4
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-go1.27-${{ hashFiles('**/go.mod') }}-shard-${{ matrix.shard }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-go1.27-
      - name: Install golangci-lint
        run: make setup-golangci-lint
      - name: golangci-lint (all modules)
        run: make lint-all

  # Fast gate: runs on every push and PR. No -race, no coverage, no
  # instrumentation — just enough to catch build breaks, vet issues, and
  # go.mod drift quickly. Per-module loops (no root go.mod exists).
  test:
    name: test (go 1.27)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # CI runners ship Chrome but its sandbox is unusable in the container;
      # the document/local render tests need --no-sandbox to execute.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      SHARD_TOTAL: 4
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: vet + tidy + test + build (all modules)
        run: make check-all
      - name: out-of-tree proof module (standalone, outside go.work)
        if: matrix.shard == 0
        run: GOWORK=off go -C examples/external-sms test -count=1 ./...

  # Nested module gate: tools/zever-lsp is a separate Go module, so the
  # root jobs above never compile or test it. Mirrors the fast gate.
  lsp:
    name: zever-lsp module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-lsp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Full gate: race detector + atomic coverage + Codecov upload, per
  # module (no root go.mod exists). Coverage profiles land per module
  # under .coverage/ and upload merged. Expensive pass: runs on every
  # push and PR so races are caught before merge.
  test-race:
    name: test (race + coverage)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Same Chrome sandbox limitation as the fast gate above.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      SHARD_TOTAL: 4
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: go test -race (all modules)
        run: make test-race-all
      - name: Collect coverage files
        id: collect
        run: echo "files=$(find .coverage -name '*.out' | paste -sd ',' -)" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ${{ steps.collect.outputs.files }}
          flags: race-shard-${{ matrix.shard }}
          fail_ci_if_error: false

  vulnerability:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-govulncheck-v1.8.0
      - name: Install tools
        run: make setup-govulncheck
      - name: govulncheck
        run: make vulncheck-all

  sbom:
    name: sbom
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-cyclonedx-gomod-v1.12.0
      - name: Install tools
        run: make setup-cyclonedx-gomod
      - name: Generate SBOM (all modules)
        run: make sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
