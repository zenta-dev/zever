name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A concurrency group holds at most one running + one pending run; a newer
# queued run cancels the older pending one. Keying main pushes by commit SHA
# gives every main commit its own group, so rapid automerges no longer drop
# queued runs. PRs/branches keep one group per ref and cancel superseded runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    name: detect affected modules
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.affected.outputs.groups }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Compute affected groups
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OUT=$(go run ./tools/affected --mode=affected --base "origin/${{ github.base_ref }}" --max-groups 4)
          else
            OUT=$(go run ./tools/affected --mode=all --max-groups 4)
          fi
          echo "groups=$(echo "$OUT" | jq -c .groups)" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$OUT" | jq -r .reason)" >> "$GITHUB_OUTPUT"

  fmt:
    name: gofmt
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted with gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: [detect]
    if: needs.detect.outputs.groups != '[]'
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.work') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.work') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-golangci-lint-v2.15.0-${{ hashFiles('go.work') }}
      - name: Install golangci-lint
        run: command -v golangci-lint >/dev/null || make setup-golangci-lint
      - name: golangci-lint (all modules)
        run: make lint-all

  # Fast gate: runs on every push and PR. No -race, no coverage, no
  # instrumentation — just enough to catch build breaks, vet issues, and
  # go.mod drift quickly. Per-module loops (no root go.mod exists).
  test:
    name: test (go 1.27)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: [detect]
    if: needs.detect.outputs.groups != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # CI runners ship Chrome but its sandbox is unusable in the container;
      # the document/local render tests need --no-sandbox to execute.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: vet + tidy + test + build (all modules)
        run: make check-all

  # Installer fail-closed gate: install.sh / install.ps1 verification,
  # escape hatch, and attestation hints. Offline: stubbed PATH + fixture
  # release, no GitHub releases access needed.
  installer:
    name: installer (fail-closed)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer tests
        run: sh tools/installer-test.sh

  # Changelog tooling gate: the fragment compiler must fold the fragments in
  # .changelog/unreleased into the changelog's pending section (## [Unreleased],
  # or the top release section while its version carries no tag yet) and the
  # lint must stay green. The pending-section check guards the release-cut
  # invariant: the cut renames ## [Unreleased] to the new release section but
  # keeps an empty ## [Unreleased] above it, so the next release always has a
  # pending section. Local mirror: `make changelog-compile-test` and
  # `make changelog-compile-check`.
  changelog:
    name: changelog (compile + lint)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Changelog compiler tests
        run: bash tools/changelog-compile-test.sh
      - name: Pending section exists
        run: make changelog-compile-check
      - name: Lint the changelog
        run: make changelog-lint

  # Generated-code drift gate: examples/todo commits its generated/ tree,
  # so `zever compile --check` must report it up to date (also `make
  # compile-check`, wired into `make check`). Regenerate with `zever
  # compile` from examples/todo when the schema changes.
  drift:
    name: generated-code drift
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check committed generated code matches the schema
        run: make compile-check

  # Module-graph drift gate: every module's go.mod must require+replace
  # each intra-repo module it directly imports, computed by tools/modgraph
  # (Go ignores replaces in dependency go.mods). --check exits 1 with a
  # listing when any entry is missing; run the tool without --check
  # locally to repair.
  module-graph:
    name: module-graph
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check module graph closure
        run: go run ./tools/modgraph --check

  # Struct-tag gate: AST-based check that file-decoded Options and JSON wire
  # types keep their json/toml/yaml tags (see the serialization rule in
  # AGENTS.md). The `make check-tags` target lands via fix/restore-json-tags;
  # the job is wired here now so the gate turns green as soon as that branch
  # merges. The full history is required (fetch-depth 0): the pinned json
  # wire keys are derived from the git history (the v0.7.2 baseline
  # release), and `make tag-golden-check` verifies that the committed data
  # still matches it.
  check-tags:
    name: check-tags
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check struct tags (AST)
        run: make check-tags
      - name: Check the pinned json wire keys against the git history
        run: make tag-golden-check

  # Error-convention gate: every error message carries the "<package>: "
  # prefix, wraps its cause with %w, and never panics outside the resolver
  # invariants (see docs/errors.md and the errors rule in AGENTS.md). The
  # scan is repo-wide and cheap; `make err-lint` is also part of `make check`.
  err-lint:
    name: err-lint
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check the error conventions
        run: make err-lint

  # Conformance gate: runs every in-kit conformance suite (core/<battery>)
  # plus every cross-adapter conformance suite (adapters/<battery>/<adapter>).
  # All suites are hermetic (memory/local-backed, miniredis, sqlite, stubs;
  # no network) and expected green.
  conformance:
    name: conformance
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    env:
      # Same Chrome sandbox limitation as the test jobs: the document/local
      # render conformance suite needs --no-sandbox in the CI container.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: conformance kits (in-kit suites)
        run: |
          go -C core/agent test -count=1 ./...
          go -C core/ai test -count=1 ./...
          go -C core/analytics test -count=1 ./...
          go -C core/auth test -count=1 ./...
          go -C core/authz test -count=1 ./...
          go -C core/billing test -count=1 ./...
          go -C core/cache test -count=1 ./...
          go -C core/crypto test -count=1 ./...
          go -C core/eventbus test -count=1 ./...
          go -C core/flag test -count=1 ./...
          go -C core/geo test -count=1 ./...
          go -C core/i18n test -count=1 ./...
          go -C core/idempotency test -count=1 ./...
          go -C core/job test -count=1 ./...
          go -C core/lock test -count=1 ./...
          go -C core/log test -count=1 ./...
          go -C core/mailer test -count=1 ./...
          go -C core/middleware test -count=1 ./...
          go -C core/notification test -count=1 ./...
          go -C core/observability test -count=1 ./...
          go -C core/password test -count=1 ./...
          go -C core/payment test -count=1 ./...
          go -C core/permission test -count=1 ./...
          go -C core/queue test -count=1 ./...
          go -C core/rag test -count=1 ./...
          go -C core/ratelimit test -count=1 ./...
          go -C core/router test -count=1 ./...
          go -C core/scheduler test -count=1 ./...
          go -C core/secrets test -count=1 ./...
          go -C core/session test -count=1 ./...
          go -C core/storage test -count=1 ./...
          go -C core/tenant test -count=1 ./...
          go -C core/webhook test -count=1 ./...
          go -C core/workflow test -count=1 ./...
      - name: cross-adapter conformance
        run: |
          go -C adapters/ai/anthropic test -count=1 -run Conformance ./...
          go -C adapters/ai/gemini test -count=1 -run Conformance ./...
          go -C adapters/ai/ollama test -count=1 -run Conformance ./...
          go -C adapters/ai/openai test -count=1 -run Conformance ./...
          go -C adapters/analytics/log test -count=1 -run Conformance ./...
          go -C adapters/analytics/posthog test -count=1 -run Conformance ./...
          go -C adapters/auth/jwt test -count=1 -run Conformance ./...
          go -C adapters/auth/oidc test -count=1 -run Conformance ./...
          go -C adapters/auth/session test -count=1 -run Conformance ./...
          go -C adapters/billing/paddle test -count=1 -run Conformance ./...
          go -C adapters/billing/stripe test -count=1 -run Conformance ./...
          go -C adapters/billing/stub test -count=1 -run Conformance ./...
          go -C adapters/cache/db test -count=1 -run Conformance ./...
          go -C adapters/cache/redis test -count=1 -run Conformance ./...
          go -C adapters/crypto/kms test -count=1 -run Conformance ./...
          go -C adapters/crypto/local test -count=1 -run Conformance ./...
          go -C adapters/db/postgres test -count=1 -run Conformance ./...
          go -C adapters/db/sqlite test -count=1 -run Conformance ./...
          go -C adapters/document/latex test -count=1 -run Conformance ./...
          go -C adapters/document/local test -count=1 -run Conformance ./...
          go -C adapters/document/remote test -count=1 -run Conformance ./...
          go -C adapters/eventbus/memory test -count=1 -run Conformance ./...
          go -C adapters/eventbus/redis test -count=1 -run Conformance ./...
          go -C adapters/flag/firebase test -count=1 -run Conformance ./...
          go -C adapters/flag/static test -count=1 -run Conformance ./...
          go -C adapters/geo/google test -count=1 -run Conformance ./...
          go -C adapters/geo/osm test -count=1 -run Conformance ./...
          go -C adapters/geo/static test -count=1 -run Conformance ./...
          go -C adapters/i18n/embed test -count=1 -run Conformance ./...
          go -C adapters/i18n/remote test -count=1 -run Conformance ./...
          go -C adapters/idempotency/db test -count=1 -run Conformance ./...
          go -C adapters/idempotency/memory test -count=1 -run Conformance ./...
          go -C adapters/idempotency/redis test -count=1 -run Conformance ./...
          go -C adapters/lock/memory test -count=1 -run Conformance ./...
          go -C adapters/lock/redis test -count=1 -run Conformance ./...
          go -C adapters/log/noop test -count=1 -run Conformance ./...
          go -C adapters/log/pretty test -count=1 -run Conformance ./...
          go -C adapters/log/slog test -count=1 -run Conformance ./...
          go -C adapters/log/zerolog test -count=1 -run Conformance ./...
          go -C adapters/mailer/log test -count=1 -run Conformance ./...
          go -C adapters/mailer/smtp test -count=1 -run Conformance ./...
          go -C adapters/media/local test -count=1 -run Conformance ./...
          go -C adapters/media/s3 test -count=1 -run Conformance ./...
          go -C adapters/notification/fcm test -count=1 -run Conformance ./...
          go -C adapters/notification/log test -count=1 -run Conformance ./...
          go -C adapters/notification/twilio test -count=1 -run Conformance ./...
          go -C adapters/observability/noop test -count=1 -run Conformance ./...
          go -C adapters/observability/otlp test -count=1 -run Conformance ./...
          go -C adapters/observability/stdout test -count=1 -run Conformance ./...
          go -C adapters/password/argon2 test -count=1 -run Conformance ./...
          go -C adapters/payment/paddle test -count=1 -run Conformance ./...
          go -C adapters/payment/stripe test -count=1 -run Conformance ./...
          go -C adapters/payment/stub test -count=1 -run Conformance ./...
          go -C adapters/permission/casbin test -count=1 -run Conformance ./...
          go -C adapters/permission/noop test -count=1 -run Conformance ./...
          go -C adapters/permission/rbac test -count=1 -run Conformance ./...
          go -C adapters/queue/db test -count=1 -run Conformance ./...
          go -C adapters/queue/redis test -count=1 -run Conformance ./...
          go -C adapters/ratelimit/memory test -count=1 -run Conformance ./...
          go -C adapters/ratelimit/redis test -count=1 -run Conformance ./...
          go -C adapters/router/fiber test -count=1 -run Conformance ./...
          go -C adapters/router/stdhttp test -count=1 -run Conformance ./...
          go -C adapters/scheduler/embedded test -count=1 -run Conformance ./...
          go -C adapters/scheduler/postgres test -count=1 -run Conformance ./...
          go -C adapters/search/db test -count=1 -run Conformance ./...
          go -C adapters/search/meilisearch test -count=1 -run Conformance ./...
          go -C adapters/secrets/env test -count=1 -run Conformance ./...
          go -C adapters/secrets/vault test -count=1 -run Conformance ./...
          go -C adapters/session/cookie test -count=1 -run Conformance ./...
          go -C adapters/session/db test -count=1 -run Conformance ./...
          go -C adapters/session/memory test -count=1 -run Conformance ./...
          go -C adapters/session/redis test -count=1 -run Conformance ./...
          go -C adapters/storage/local test -count=1 -run Conformance ./...
          go -C adapters/storage/r2 test -count=1 -run Conformance ./...
          go -C adapters/storage/s3 test -count=1 -run Conformance ./...
          go -C adapters/tenant/header test -count=1 -run Conformance ./...
          go -C adapters/tenant/single test -count=1 -run Conformance ./...
          go -C adapters/vectorstore/db test -count=1 -run Conformance ./...
          go -C adapters/vectorstore/qdrant test -count=1 -run Conformance ./...
          go -C adapters/webhook/http test -count=1 -run Conformance ./...
          go -C adapters/webhook/queue test -count=1 -run Conformance ./...
          go -C adapters/workflow/db test -count=1 -run Conformance ./...
          go -C adapters/workflow/memory test -count=1 -run Conformance ./...

  external-sms:
    name: out-of-tree proof module
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          (cd examples/external-sms && GOWORK=off go mod download) && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: out-of-tree proof module (standalone, outside go.work)
        run: GOWORK=off go -C examples/external-sms test -count=1 ./...

  # Fuzz smoke: a short run of security-critical fuzz targets across the
  # repo (DSL frontend, webhook signatures, storage traversal, payment
  # webhooks, JWT claims). Not a soak: it catches regressions that the
  # committed seed corpus plus mutation can reach. Failing inputs are
  # written under testdata/fuzz and should be committed with the fix.
  fuzz-smoke:
    name: fuzz smoke (security)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          make -s download-all MODULES="config dsl adapters/webhook/queue adapters/storage/local adapters/payment/stripe adapters/payment/paddle adapters/auth/jwt" && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Fuzz DSL targets
        working-directory: dsl
        run: |
          set -euo pipefail
          for target in lexer:FuzzLex parser:FuzzParse resolver:FuzzResolve format:FuzzFormatIdempotent; do
            pkg="${target%%:*}"; fn="${target##*:}"
            echo "== ${pkg} ${fn}"
            go test -run '^$' -fuzz "^${fn}\$" -fuzztime 20s "./${pkg}"
          done
      - name: Fuzz webhook signature verification
        working-directory: adapters/webhook/queue
        run: |
          set -euo pipefail
          for target in FuzzVerifySignatureHeader FuzzParseSignatureHeader FuzzBuildSignatureHeader; do
            echo "== ${target}"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
          done
      - name: Fuzz storage traversal
        working-directory: adapters/storage/local
        run: |
          set -euo pipefail
          for target in FuzzTraversal FuzzPresignKeyValidation FuzzSymlinkContainment; do
            echo "== ${target}"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
          done
      - name: Fuzz payment webhooks
        run: |
          set -euo pipefail
          for target in FuzzWebhookEvent; do
            echo "== adapters/payment/stripe ${target}"
            go -C adapters/payment/stripe test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
            echo "== adapters/payment/paddle ${target}"
            go -C adapters/payment/paddle test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
          done
      - name: Fuzz JWT token claims
        working-directory: adapters/auth/jwt
        run: |
          set -euo pipefail
          # JWT fuzz targets will be added when needed
          echo "JWT fuzz targets: verify FuzzVerify when added"

  # Scaffold gate: `zever new` -> go mod tidy -> build/vet/test, plus
  # golangci-lint under the scaffold's own .golangci.yml, so a fresh project
  # always starts green. Installs golangci-lint so the lint leg of the test runs.
  scaffold:
    name: scaffold builds, tests and lints
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Install golangci-lint
        run: make setup-golangci-lint && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scaffold, build, vet, test and lint
        run: go -C cmd/zever test -count=1 -run 'TestRunNewScaffoldsAndBuilds' ./...

  # Nested module gate: tools/zever-lsp is a separate Go module, so the
  # root jobs above never compile or test it. Mirrors the fast gate.
  lsp:
    name: zever-lsp module
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-lsp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Download dependencies (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Nested module gate: tools/zever-mcp is a separate Go module (like
  # zever-lsp), so the root jobs above never compile or test it. Mirrors the
  # fast gate.
  mcp:
    name: zever-mcp module
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Download dependencies (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Full gate: race detector + atomic coverage + Codecov upload, per
  # module (no root go.mod exists). Coverage profiles land per module
  # under .coverage/ and upload merged. Expensive pass: runs on every
  # push and PR so races are caught before merge.
  test-race:
    name: test (race + coverage)
    timeout-minutes: 40
    if: needs.detect.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    needs: [detect, fast-gate]
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # Same Chrome sandbox limitation as the fast gate above.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: go test -race (PR fast gate, no coverage)
        if: github.event_name == 'pull_request'
        run: make test-race-fast
      # Order/iteration-dependence gate (PRs only): reruns the affected
      # modules with shuffled test order and a second iteration so flakes that
      # depend on shared global state or execution order fail here instead of
      # in the nightly flake-hunt. The seed is echoed so a failure is
      # reproducible with: go test -race -shuffle=<seed> ./...
      - name: go test -race -shuffle -count=2 (PR order-dependence gate)
        if: github.event_name == 'pull_request'
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "test-race-pr shuffle seed: $seed"
          make test-race-pr SHUFFLE_SEED=$seed
      - name: go test -race with coverage (main/tags)
        if: github.event_name != 'pull_request'
        run: make test-race-all
      - name: Collect coverage files
        if: github.event_name != 'pull_request'
        id: collect
        run: echo "files=$(find .coverage -name '*.out' | paste -sd ',' -)" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.collect.outputs.files }}
          flags: race-group-${{ strategy.job-index }}
          fail_ci_if_error: false

  # Benchmark smoke run (main/tags only), split out of test-race: the old
  # -benchtime=1s -count=6 pass took ~33 min per group and hit the 40-min
  # job timeout on every main push. Shared runners are too noisy for
  # trustworthy perf numbers anyway, so this run only proves every benchmark
  # still executes (fixed 100 iterations, one sample) and archives the raw
  # output for ad-hoc benchstat comparison. Non-gating: continue-on-error and
  # deliberately absent from ci-gate.needs.
  bench:
    name: benchmarks (non-gating)
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && needs.detect.outputs.groups != '[]'
    continue-on-error: true
    runs-on: ubuntu-24.04
    needs: [detect, fast-gate]
    permissions:
      contents: read
    strategy:
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # Same Chrome sandbox limitation as the test jobs.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: benchmarks (smoke, 100 iterations)
        run: |
          mkdir -p .bench
          failed=""
          for m in $MODULES; do
            slug=$(echo "$m" | tr / _)
            if ! go -C "$m" test -run='^$' -bench=. -benchtime=100x -count=1 -cpu=1 -benchmem ./... > ".bench/$slug.txt" 2>&1; then
              echo "::error::benchmark failed: $m"
              cat ".bench/$slug.txt"
              failed="$failed $m"
            fi
          done
          [ -z "$failed" ] || { echo "FAILED benchmark modules:$failed"; exit 1; }
          echo "benchmark runs complete"
      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact names are immutable per run since upload-artifact v4,
          # so each matrix group needs its own name.
          name: benchmarks-${{ strategy.job-index }}
          path: .bench/
          if-no-files-found: warn
          retention-days: 30

  # Security coverage floor: Codecov uploads are informational only, so this
  # gate hard-fails main/tags when auth/crypto/payment coverage drops below
  # the floor (80; stripe measured 83.0, so 85 would ship red-on-main — see
  # tools/coverage-floor.sh header). Scoped re-run (7 modules) stays under 5
  # minutes. PRs run the race fast-gate without coverage, so this job is
  # main/tags only and ignores affected-modules (always runs). It re-runs
  # its own scoped tests and consumes nothing from test-race, so it runs in
  # parallel rather than waiting on it; ci-gate still requires both.
  coverage-floor:
    name: coverage-floor
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          make -s download-all MODULES="core/auth core/crypto core/password core/authz core/payment adapters/payment/stripe adapters/payment/paddle" && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: race + coverage (scoped security modules)
        run: make test-race-all MODULES="core/auth core/crypto core/password core/authz core/payment adapters/payment/stripe adapters/payment/paddle"
      - name: enforce coverage floor
        run: tools/coverage-floor.sh --threshold 80

  vulnerability:
    name: govulncheck
    timeout-minutes: 30
    # Blocking on PRs and main: reachable vulnerabilities fail the gate.
    # Accepted risk lives in .github/govulncheck-allowlist.json with a
    # reason and an expiry date; expired entries fail closed. Unreachable
    # (import-only) findings are reported but never block.
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-govulncheck-v1.8.0
      - name: Install tools
        run: make setup-govulncheck
      - name: govulncheck
        run: make vulncheck-all

  # API compatibility gate: Core-tier modules (config, container,
  # core/{auth,cache,crypto,db,password,queue,router,secrets,session}, dsl,
  # orm) are diffed against their latest <dir>/vX.Y.Z tag with
  # golang.org/x/exp/apidiff (make apidiff). Incompatible changes fail
  # unless the changelog's pending-release section carries a **Breaking:**
  # line: ## [Unreleased], or the top ## [vX.Y.Z] section while it is the
  # in-development version (cmd/zever/VERSION) and is not tagged yet (a cut
  # but untagged release).
  # fetch-depth 0 is required: the default shallow checkout has no tags.
  apidiff:
    name: apidiff
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: API compatibility against last tags
        run: make apidiff

  # Patch-release guard: no Core-tier breaking change may ship in a patch.
  # `go run ./tools/apidiff --check-patch` scans released X.Y.Z sections
  # newer than cmd/zever/VERSION and fails when a **Breaking:** entry names
  # a Core module (Extended packages may still break in patches pre-1.0).
  # Older sections are grandfathered by the VERSION floor; the bad fixture
  # is pinned by tools/apidiff/patch_test.go (TestCheckPatchFailsOnBadFixture).
  patch-break:
    name: patch-break
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: No Core-tier breaks in patch releases
        run: go run ./tools/apidiff --check-patch
      - name: Compatibility matrix is current
        run: go run ./tools/apidiff --check-compat-matrix docs/src/content/docs/reference/compatibility-matrix.mdx

  sbom:
    name: sbom
    timeout-minutes: 20
    if: needs.detect.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    needs: [detect, fast-gate]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-cyclonedx-gomod-v1.12.0
      - name: Install tools
        run: make setup-cyclonedx-gomod
      # The SBOM resolution script resolves the module graph through the
      # proxy, and falls back to the local intra-repo closure while the
      # pinned siblings are unpublished. Offline: empty file:// proxy and a
      # stubbed cyclonedx-gomod. Local mirror: `make sbom-test`.
      - name: SBOM resolution script tests
        run: make sbom-test
      - name: Generate SBOM (affected modules)
        run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx-${{ strategy.job-index }}
          path: sbom/
      # SLSA build provenance over the generated SBOMs. OIDC-minted
      # attestations only exist on GitHub-hosted runs (no local
      # reproduction); verify a downloaded SBOM with:
      # gh attestation verify sbom/<slug>.json --repo zenta-dev/zever
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom/*.json

  # Doc snippet guard: every ```go block import path / pkg.Symbol in *.md/*.mdx
  # must resolve against the workspace (migration.mdx + CHANGELOG.md history
  # exempt — old paths there are intentional).
  doc-snippets:
    name: doc-snippets
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
          (cd docs/examples && GOWORK=off go mod download) && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: Check doc Go snippets
        run: tools/check-doc-snippets.sh
      - name: Tested doc samples (docs/examples, outside go.work)
        run: GOWORK=off go -C docs/examples test -count=1 ./...

  # Docs facts gate: the published pages must agree with the Go source
  # (env keys and their instance namespace, adapter names, container
  # accessors, CLI commands/flags, import paths). The audit reads the Go
  # source as its only truth, so it runs on every PR: a code change that
  # invalidates a page fails here even when no page was touched.
  #
  # The same job runs the two offline docs gates (style lint, internal
  # link check) so they hold on every PR, not only on the ones that touch
  # docs/. The external link check needs the network and lives in the
  # docs workflow as a report.
  # Local mirror: `make docs-gates`.
  docs-audit:
    name: docs-audit
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci
        working-directory: docs
      - name: Audit docs claims against the code
        run: npm run audit
        working-directory: docs
      - name: Prove the docs audit rejects the mistakes it guards against
        run: npm run audit:self-test
        working-directory: docs
      - name: Lint docs style
        run: npm run lint
        working-directory: docs
      - name: Prove the docs style lint rejects the mistakes it guards against
        run: npm run lint:self-test
        working-directory: docs
      - name: Check the repo never configures through a legacy config file
        run: npm run check-legacy-config
        working-directory: docs
      - name: Prove the legacy config file check rejects the mistakes it guards against
        run: npm run check-legacy-config:self-test
        working-directory: docs
      - name: Fact-check the repository markdown against the code
        run: npm run audit-repo
        working-directory: docs
      - name: Prove the repository markdown fact check rejects the mistakes it guards against
        run: npm run audit-repo:self-test
        working-directory: docs
      - name: Fact-check the package doc.go corpus against the code
        run: npm run audit-docgo
        working-directory: docs
      - name: Prove the doc.go fact check rejects the mistakes it guards against
        run: npm run audit-docgo:self-test
        working-directory: docs
      - name: Build docs
        run: npm run build
        working-directory: docs
      - name: Check internal links
        run: npm run check-links
        working-directory: docs
      - name: Prove the docs link check rejects the mistakes it guards against
        run: npm run check-links:self-test
        working-directory: docs

  # Compile-fail gate (stream G): every misuse fixture under
  # container/testdata/compilefail/* is an own tiny module (excluded from
  # go.work, ignored via testdata) that MUST fail `go build`, proving
  # typed-Ref misuse does not compile. A fixture that starts compiling means
  # the type-level guard regressed. Message-level assertions live in
  # container/compilefail_test.go; this job asserts the build outcome.
  # Local mirror: `make compilefail-check`.
  compilefail:
    name: compile-fail fixtures
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Assert misuse fixtures fail to build
        run: make compilefail-check

  # .env fuzz smoke (stream G): a short run of stream A's config parser fuzz
  # targets (60s each). Not a soak: it catches regressions the committed
  # seeds plus a minute of mutation can reach, mirroring the dsl fuzz-smoke
  # policy. Failing inputs land under config/testdata/fuzz and should be
  # committed with the fix. The fuzz tests themselves are owned by stream A;
  # this job only wires the execution. Local mirror: `make fuzz-smoke-config`
  # (override: FUZZTIME=10s).
  env-fuzz-smoke:
    name: fuzz smoke (config)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    needs: [fast-gate]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Fuzz config targets
        run: make fuzz-smoke-config

  # TODO(D2): `zever generate --check` over examples does not exist yet
  # (generate has no --check flag on main). When D2 ships it, add a
  # generate-drift job here mirroring `drift` (compile --check) and list it
  # in ci-gate needs. Deliberately not blocking this stream's merge.
  #   generate-drift:
  #     name: generate --check drift
  #     timeout-minutes: 10
  #     runs-on: ubuntu-24.04
  #     permissions:
  #       contents: read
  #     steps:
  #       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
  #         with:
  #           go-version-file: go.work
  #       - name: Check generated code matches the schema
  #         run: zever generate --check ./examples/...

  # Fast gate: aggregates the cheap tier (fmt, lint, test, drift, tags,
  # errors, modules, docs-toolchain-adjacent checks). Expensive jobs
  # (race, sbom, bench, conformance, fuzz, scaffold, vuln, apidiff,
  # docs) wait on this gate so a cheap failure cancels them early.
  # Passes on success/skipped (docs-only skips), fails on failure/cancelled.
  fast-gate:
    name: fast-gate
    timeout-minutes: 5
    if: always()
    runs-on: ubuntu-24.04
    needs: [detect, fmt, lint, test, module-graph, check-tags, err-lint, drift, changelog, lsp, mcp, compilefail, installer]
    steps:
      - name: Aggregate fast results
        run: |
          case "${{ join(needs.*.result, ' ') }}" in
            *failure*|*cancelled*) echo fast-gate failed; exit 1;;
            *) echo "fast-gate passed";;
          esac

  ci-gate:
    name: ci-gate
    timeout-minutes: 5
    if: always()
    runs-on: ubuntu-24.04
    needs: [detect, fmt, lint, test, test-race, coverage-floor, sbom, lsp, mcp, vulnerability, external-sms, doc-snippets, docs-audit, module-graph, conformance, apidiff, patch-break, fuzz-smoke, env-fuzz-smoke, compilefail, scaffold, check-tags, err-lint, changelog, fast-gate]
    steps:
      - name: Aggregate results
        run: |
          case "${{ join(needs.*.result, ' ') }}" in
            *failure*|*cancelled*) echo gate failed; exit 1;;
            *) echo "gate passed";;
          esac
