name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A concurrency group holds at most one running + one pending run; a newer
# queued run cancels the older pending one. Keying main pushes by commit SHA
# gives every main commit its own group, so rapid automerges no longer drop
# queued runs. PRs/branches keep one group per ref and cancel superseded runs.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect:
    name: detect affected modules
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.affected.outputs.groups }}
      reason: ${{ steps.affected.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Compute affected groups
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OUT=$(go run ./tools/affected --mode=affected --base "origin/${{ github.base_ref }}" --max-groups 4)
          else
            OUT=$(go run ./tools/affected --mode=all --max-groups 4)
          fi
          echo "groups=$(echo "$OUT" | jq -c .groups)" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$OUT" | jq -r .reason)" >> "$GITHUB_OUTPUT"

  fmt:
    name: gofmt
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted with gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.groups != '[]'
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.work') }}-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.work') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-golangci-lint-v2.13.2
      - name: Install golangci-lint
        run: command -v golangci-lint >/dev/null || make setup-golangci-lint
      - name: golangci-lint (all modules)
        run: make lint-all

  # Fast gate: runs on every push and PR. No -race, no coverage, no
  # instrumentation — just enough to catch build breaks, vet issues, and
  # go.mod drift quickly. Per-module loops (no root go.mod exists).
  test:
    name: test (go 1.27)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.groups != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # CI runners ship Chrome but its sandbox is unusable in the container;
      # the document/local render tests need --no-sandbox to execute.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: vet + tidy + test + build (all modules)
        run: make check-all

  # Module-graph drift gate: every module's go.mod must require+replace
  # each intra-repo module it directly imports, computed by tools/modgraph
  # (Go ignores replaces in dependency go.mods). --check exits 1 with a
  # listing when any entry is missing; run the tool without --check
  # locally to repair.
  module-graph:
    name: module-graph
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check module graph closure
        run: go run ./tools/modgraph --check

  # Conformance gate: runs every in-kit conformance suite (core/<battery>)
  # plus every cross-adapter conformance suite (adapters/<battery>/<adapter>).
  # All suites are hermetic (memory/local-backed, miniredis, sqlite, stubs;
  # no network) and expected green.
  conformance:
    name: conformance
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # Same Chrome sandbox limitation as the test jobs: the document/local
      # render conformance suite needs --no-sandbox in the CI container.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: conformance kits (in-kit suites)
        run: |
          go -C core/agent test -count=1 ./...
          go -C core/ai test -count=1 ./...
          go -C core/analytics test -count=1 ./...
          go -C core/auth test -count=1 ./...
          go -C core/authz test -count=1 ./...
          go -C core/billing test -count=1 ./...
          go -C core/cache test -count=1 ./...
          go -C core/crypto test -count=1 ./...
          go -C core/eventbus test -count=1 ./...
          go -C core/flag test -count=1 ./...
          go -C core/geo test -count=1 ./...
          go -C core/i18n test -count=1 ./...
          go -C core/idempotency test -count=1 ./...
          go -C core/job test -count=1 ./...
          go -C core/lock test -count=1 ./...
          go -C core/log test -count=1 ./...
          go -C core/mailer test -count=1 ./...
          go -C core/middleware test -count=1 ./...
          go -C core/notification test -count=1 ./...
          go -C core/observability test -count=1 ./...
          go -C core/password test -count=1 ./...
          go -C core/payment test -count=1 ./...
          go -C core/permission test -count=1 ./...
          go -C core/queue test -count=1 ./...
          go -C core/rag test -count=1 ./...
          go -C core/ratelimit test -count=1 ./...
          go -C core/router test -count=1 ./...
          go -C core/scheduler test -count=1 ./...
          go -C core/secrets test -count=1 ./...
          go -C core/session test -count=1 ./...
          go -C core/storage test -count=1 ./...
          go -C core/tenant test -count=1 ./...
          go -C core/webhook test -count=1 ./...
          go -C core/workflow test -count=1 ./...
      - name: cross-adapter conformance
        run: |
          go -C adapters/ai/anthropic test -count=1 -run Conformance ./...
          go -C adapters/ai/gemini test -count=1 -run Conformance ./...
          go -C adapters/ai/ollama test -count=1 -run Conformance ./...
          go -C adapters/ai/openai test -count=1 -run Conformance ./...
          go -C adapters/analytics/log test -count=1 -run Conformance ./...
          go -C adapters/analytics/posthog test -count=1 -run Conformance ./...
          go -C adapters/auth/jwt test -count=1 -run Conformance ./...
          go -C adapters/auth/oidc test -count=1 -run Conformance ./...
          go -C adapters/auth/session test -count=1 -run Conformance ./...
          go -C adapters/billing/paddle test -count=1 -run Conformance ./...
          go -C adapters/billing/stripe test -count=1 -run Conformance ./...
          go -C adapters/billing/stub test -count=1 -run Conformance ./...
          go -C adapters/cache/db test -count=1 -run Conformance ./...
          go -C adapters/cache/redis test -count=1 -run Conformance ./...
          go -C adapters/crypto/kms test -count=1 -run Conformance ./...
          go -C adapters/crypto/local test -count=1 -run Conformance ./...
          go -C adapters/db/postgres test -count=1 -run Conformance ./...
          go -C adapters/db/sqlite test -count=1 -run Conformance ./...
          go -C adapters/document/latex test -count=1 -run Conformance ./...
          go -C adapters/document/local test -count=1 -run Conformance ./...
          go -C adapters/document/remote test -count=1 -run Conformance ./...
          go -C adapters/eventbus/memory test -count=1 -run Conformance ./...
          go -C adapters/eventbus/redis test -count=1 -run Conformance ./...
          go -C adapters/flag/firebase test -count=1 -run Conformance ./...
          go -C adapters/flag/static test -count=1 -run Conformance ./...
          go -C adapters/geo/google test -count=1 -run Conformance ./...
          go -C adapters/geo/osm test -count=1 -run Conformance ./...
          go -C adapters/geo/static test -count=1 -run Conformance ./...
          go -C adapters/i18n/embed test -count=1 -run Conformance ./...
          go -C adapters/i18n/remote test -count=1 -run Conformance ./...
          go -C adapters/idempotency/db test -count=1 -run Conformance ./...
          go -C adapters/idempotency/memory test -count=1 -run Conformance ./...
          go -C adapters/idempotency/redis test -count=1 -run Conformance ./...
          go -C adapters/lock/memory test -count=1 -run Conformance ./...
          go -C adapters/lock/redis test -count=1 -run Conformance ./...
          go -C adapters/log/noop test -count=1 -run Conformance ./...
          go -C adapters/log/pretty test -count=1 -run Conformance ./...
          go -C adapters/log/slog test -count=1 -run Conformance ./...
          go -C adapters/log/zerolog test -count=1 -run Conformance ./...
          go -C adapters/mailer/log test -count=1 -run Conformance ./...
          go -C adapters/mailer/smtp test -count=1 -run Conformance ./...
          go -C adapters/media/local test -count=1 -run Conformance ./...
          go -C adapters/media/s3 test -count=1 -run Conformance ./...
          go -C adapters/notification/fcm test -count=1 -run Conformance ./...
          go -C adapters/notification/log test -count=1 -run Conformance ./...
          go -C adapters/notification/twilio test -count=1 -run Conformance ./...
          go -C adapters/observability/noop test -count=1 -run Conformance ./...
          go -C adapters/observability/otlp test -count=1 -run Conformance ./...
          go -C adapters/observability/stdout test -count=1 -run Conformance ./...
          go -C adapters/password/argon2 test -count=1 -run Conformance ./...
          go -C adapters/payment/paddle test -count=1 -run Conformance ./...
          go -C adapters/payment/stripe test -count=1 -run Conformance ./...
          go -C adapters/payment/stub test -count=1 -run Conformance ./...
          go -C adapters/permission/casbin test -count=1 -run Conformance ./...
          go -C adapters/permission/noop test -count=1 -run Conformance ./...
          go -C adapters/permission/rbac test -count=1 -run Conformance ./...
          go -C adapters/queue/db test -count=1 -run Conformance ./...
          go -C adapters/queue/redis test -count=1 -run Conformance ./...
          go -C adapters/ratelimit/memory test -count=1 -run Conformance ./...
          go -C adapters/ratelimit/redis test -count=1 -run Conformance ./...
          go -C adapters/router/fiber test -count=1 -run Conformance ./...
          go -C adapters/router/stdhttp test -count=1 -run Conformance ./...
          go -C adapters/scheduler/embedded test -count=1 -run Conformance ./...
          go -C adapters/scheduler/postgres test -count=1 -run Conformance ./...
          go -C adapters/search/db test -count=1 -run Conformance ./...
          go -C adapters/search/meilisearch test -count=1 -run Conformance ./...
          go -C adapters/secrets/env test -count=1 -run Conformance ./...
          go -C adapters/secrets/vault test -count=1 -run Conformance ./...
          go -C adapters/session/cookie test -count=1 -run Conformance ./...
          go -C adapters/session/db test -count=1 -run Conformance ./...
          go -C adapters/session/memory test -count=1 -run Conformance ./...
          go -C adapters/session/redis test -count=1 -run Conformance ./...
          go -C adapters/storage/local test -count=1 -run Conformance ./...
          go -C adapters/storage/r2 test -count=1 -run Conformance ./...
          go -C adapters/storage/s3 test -count=1 -run Conformance ./...
          go -C adapters/tenant/header test -count=1 -run Conformance ./...
          go -C adapters/tenant/single test -count=1 -run Conformance ./...
          go -C adapters/vectorstore/db test -count=1 -run Conformance ./...
          go -C adapters/vectorstore/qdrant test -count=1 -run Conformance ./...
          go -C adapters/webhook/http test -count=1 -run Conformance ./...
          go -C adapters/webhook/queue test -count=1 -run Conformance ./...
          go -C adapters/workflow/db test -count=1 -run Conformance ./...
          go -C adapters/workflow/memory test -count=1 -run Conformance ./...

  external-sms:
    name: out-of-tree proof module
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: out-of-tree proof module (standalone, outside go.work)
        run: GOWORK=off go -C examples/external-sms test -count=1 ./...

  # Nested module gate: tools/zever-lsp is a separate Go module, so the
  # root jobs above never compile or test it. Mirrors the fast gate.
  lsp:
    name: zever-lsp module
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-lsp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Nested module gate: tools/zever-mcp is a separate Go module (like
  # zever-lsp), so the root jobs above never compile or test it. Mirrors the
  # fast gate.
  mcp:
    name: zever-mcp module
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Full gate: race detector + atomic coverage + Codecov upload, per
  # module (no root go.mod exists). Coverage profiles land per module
  # under .coverage/ and upload merged. Expensive pass: runs on every
  # push and PR so races are caught before merge.
  test-race:
    name: test (race + coverage)
    timeout-minutes: 40
    if: needs.detect.outputs.groups != '[]'
    runs-on: ubuntu-latest
    needs: [detect]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # Same Chrome sandbox limitation as the fast gate above.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: go test -race (PR fast gate, no coverage)
        if: github.event_name == 'pull_request'
        run: make test-race-fast
      # Order/iteration-dependence gate (PRs only): reruns the affected
      # modules with shuffled test order and a second iteration so flakes that
      # depend on shared global state or execution order fail here instead of
      # in the nightly flake-hunt. The seed is echoed so a failure is
      # reproducible with: go test -race -shuffle=<seed> ./...
      - name: go test -race -shuffle -count=2 (PR order-dependence gate)
        if: github.event_name == 'pull_request'
        run: |
          seed=$((RANDOM * 32768 + RANDOM))
          echo "test-race-pr shuffle seed: $seed"
          make test-race-pr SHUFFLE_SEED=$seed
      - name: go test -race with coverage (main/tags)
        if: github.event_name != 'pull_request'
        run: make test-race-all
      - name: Collect coverage files
        if: github.event_name != 'pull_request'
        id: collect
        run: echo "files=$(find .coverage -name '*.out' | paste -sd ',' -)" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.collect.outputs.files }}
          flags: race-group-${{ strategy.job-index }}
          fail_ci_if_error: false

  # Benchmark smoke run (main/tags only), split out of test-race: the old
  # -benchtime=1s -count=6 pass took ~33 min per group and hit the 40-min
  # job timeout on every main push. Shared runners are too noisy for
  # trustworthy perf numbers anyway, so this run only proves every benchmark
  # still executes (fixed 100 iterations, one sample) and archives the raw
  # output for ad-hoc benchstat comparison. Non-gating: continue-on-error and
  # deliberately absent from ci-gate.needs.
  bench:
    name: benchmarks (non-gating)
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && needs.detect.outputs.groups != '[]'
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [detect]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      # Same Chrome sandbox limitation as the test jobs.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Pre-download modules (retry on transient proxy errors)
        run: |
          for i in 1 2 3; do
            make -s download-all && exit 0
            echo "download attempt $i failed; retrying"; sleep $((i * 10))
          done
          exit 1
      - name: benchmarks (smoke, 100 iterations)
        run: |
          mkdir -p .bench
          failed=""
          for m in $MODULES; do
            slug=$(echo "$m" | tr / _)
            if ! go -C "$m" test -run='^$' -bench=. -benchtime=100x -count=1 -cpu=1 -benchmem ./... > ".bench/$slug.txt" 2>&1; then
              echo "::error::benchmark failed: $m"
              cat ".bench/$slug.txt"
              failed="$failed $m"
            fi
          done
          [ -z "$failed" ] || { echo "FAILED benchmark modules:$failed"; exit 1; }
          echo "benchmark runs complete"
      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact names are immutable per run since upload-artifact v4,
          # so each matrix group needs its own name.
          name: benchmarks-${{ strategy.job-index }}
          path: .bench/
          if-no-files-found: warn
          retention-days: 30

  # Security coverage floor: Codecov uploads are informational only, so this
  # gate hard-fails main/tags when auth/crypto/payment coverage drops below
  # the floor (80; stripe measured 83.0, so 85 would ship red-on-main — see
  # tools/coverage-floor.sh header). Scoped re-run (7 modules) stays under 5
  # minutes. PRs run the race fast-gate without coverage, so this job is
  # main/tags only and ignores affected-modules (always runs). It re-runs
  # its own scoped tests and consumes nothing from test-race, so it runs in
  # parallel rather than waiting on it; ci-gate still requires both.
  coverage-floor:
    name: coverage-floor
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: race + coverage (scoped security modules)
        run: make test-race-all MODULES="core/auth core/crypto core/password core/authz core/payment adapters/payment/stripe adapters/payment/paddle"
      - name: enforce coverage floor
        run: tools/coverage-floor.sh --threshold 80

  vulnerability:
    name: govulncheck
    timeout-minutes: 30
    # New advisories must not turn unrelated PRs red: on PRs the result is
    # informational (still visible); main/schedule stay blocking.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-govulncheck-v1.8.0
      - name: Install tools
        run: make setup-govulncheck
      - name: govulncheck
        run: make vulncheck-all

  sbom:
    name: sbom
    timeout-minutes: 20
    if: needs.detect.outputs.groups != '[]'
    runs-on: ubuntu-latest
    needs: [detect]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.detect.outputs.groups) }}
    env:
      MODULES: ${{ join(matrix.group, ' ') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-cyclonedx-gomod-v1.12.0
      - name: Install tools
        run: make setup-cyclonedx-gomod
      - name: Generate SBOM (affected modules)
        run: make sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ strategy.job-index }}
          path: sbom/
      # SLSA build provenance over the generated SBOMs. OIDC-minted
      # attestations only exist on GitHub-hosted runs (no local
      # reproduction); verify a downloaded SBOM with:
      # gh attestation verify sbom/<slug>.json --repo zenta-dev/zever
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom/*.json

  # Doc snippet guard: every ```go block import path / pkg.Symbol in *.md/*.mdx
  # must resolve against the workspace (migration.mdx + CHANGELOG.md history
  # exempt — old paths there are intentional).
  doc-snippets:
    name: doc-snippets
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Check doc Go snippets
        run: tools/check-doc-snippets.sh
      - name: Tested doc samples (docs/examples, outside go.work)
        run: GOWORK=off go -C docs/examples test -count=1 ./...

  ci-gate:
    name: ci-gate
    timeout-minutes: 5
    if: always()
    runs-on: ubuntu-latest
    needs: [detect, fmt, lint, test, test-race, coverage-floor, sbom, lsp, mcp, vulnerability, external-sms, doc-snippets, module-graph, conformance]
    steps:
      - name: Aggregate results
        run: |
          case "${{ join(needs.*.result, ' ') }}" in
            *failure*|*cancelled*) echo gate failed; exit 1;;
            *) echo "gate passed";;
          esac
