name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted with gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ./...

  # Fast gate: runs on every push and PR. No -race, no coverage, no
  # instrumentation — just enough to catch build breaks, vet issues, and
  # go.mod drift quickly. This is what most pushes (including dependency
  # bumps that touch no Go code) should pay for.
  test:
    name: test (go 1.27)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # CI runners ship Chrome but its sandbox is unusable in the container;
      # the document/local render tests need --no-sandbox to execute.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        # -vet=off: go vet already ran as its own step above, so skip the
        # implicit vet pass go test does before compiling — avoids
        # re-running the same analysis twice.
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Nested module gate: tools/zever-lsp is a separate Go module, so the
  # root jobs above never compile or test it. Mirrors the fast gate.
  lsp:
    name: zever-lsp module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/zever-lsp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Download dependencies
        run: go mod download
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -vet=off -count=1 ./...
      - name: go build
        run: go build ./...

  # Multi-module gate: loops fmt/vet/tidy-check/test across every
  # directory containing a go.mod (143 modules in the committed go.work
  # workspace at root). Per-module commands only. Fast by design:
  # no -race, no coverage (those stay in test-race). Keep in sync
  # with `make check-all`.
  modules:
    name: all modules (fmt/vet/tidy/test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same Chrome sandbox limitation as the fast gate above.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted with gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi
      - name: go vet (all modules)
        run: |
          set -e
          for d in $(find . -type f -name go.mod -not -path "./.git/*" -exec dirname {} \; | sort); do
            echo "== $d =="
            (cd "$d" && go vet ./...)
          done
      - name: Verify go.mod is tidy (all modules)
        run: |
          set -e
          for d in $(find . -type f -name go.mod -not -path "./.git/*" -exec dirname {} \; | sort); do
            echo "== $d =="
            (cd "$d" && go mod tidy -diff)
          done
      - name: go test (all modules)
        # -vet=off: go vet already ran as its own step above, so skip the
        # implicit vet pass go test does before compiling — avoids
        # re-running the same analysis twice.
        run: |
          set -e
          for d in $(find . -type f -name go.mod -not -path "./.git/*" -exec dirname {} \; | sort); do
            echo "== $d =="
            (cd "$d" && go test -vet=off -count=1 ./...)
          done
      - name: go build (all modules)
        run: |
          set -e
          for d in $(find . -type f -name go.mod -not -path "./.git/*" -exec dirname {} \; | sort); do
            echo "== $d =="
            (cd "$d" && go build ./...)
          done

  # Full gate: race detector + atomic coverage + Codecov upload. This is
  # the expensive pass (typically 2-10x slower than a plain `go test`
  # because of race instrumentation, plus more overhead from atomic
  # coverage counters). Runs on every push and PR so races are caught before
  # merge instead of intermittently surfacing after landing on main.
  test-race:
    name: test (race + coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Same Chrome sandbox limitation as the fast gate above.
      ZEVER_CHROMEDP_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: Download dependencies
        run: go mod download
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.out
          fail_ci_if_error: false

  vulnerability:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-govulncheck-v1.8.0
      - name: Install tools
        run: make setup-govulncheck
      - name: govulncheck
        run: make vulncheck-all

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-cyclonedx-gomod-v1.12.0
      - name: Install tools
        run: make setup-cyclonedx-gomod
      - name: Generate SBOM
        run: make sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
