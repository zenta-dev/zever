name: bench

# Non-gating benchmark trend for orm + container hot paths. This workflow
# NEVER fails a PR: every step that could fail (benchstat compare, artifact
# download for the base) runs with continue-on-error, and the workflow is
# intentionally not listed in required status checks. Read the numbers as
# trend signal; compare shapes (allocs/op) and relative deltas via
# benchstat, not single-run ns/op (see docs benchmarks reference).
#
# Repro locally: go test -run=NONE -bench=. -benchmem -count=6 ./orm/...
# then `benchstat base.txt head.txt` (golang.org/x/perf/cmd/benchstat).

on:
  push:
    branches: [main]
    paths:
      - "orm/**"
      - "container/**"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "orm/**"
      - "container/**"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  bench-orm:
    name: bench-orm
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Run orm benchmarks
        run: go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./orm/... 2>&1 | tee bench-orm.txt
      - name: Upload orm results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-orm-${{ github.sha }}
          path: bench-orm.txt
          retention-days: 90

  bench-container:
    name: bench-container
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Run container benchmarks
        run: go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./container/... 2>&1 | tee bench-container.txt
      - name: Upload container results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-container-${{ github.sha }}
          path: bench-container.txt
          retention-days: 90

  benchstat:
    name: benchstat
    runs-on: ubuntu-latest
    needs: [bench-orm, bench-container]
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e # x/perf has no tags; pinned pseudo-version
      - name: Download head results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*-${{ github.sha }}
          merge-multiple: true
      - name: Compare with base branch (5% regression signal, non-gating)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          git stash -u || true
          git checkout -q "origin/$BASE_REF" -- orm container 2>/dev/null || true
          go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./orm/... 2>&1 | tee bench-base-orm.txt || true
          go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./container/... 2>&1 | tee bench-base-container.txt || true
          git checkout -q HEAD -- orm container 2>/dev/null || true
          # 5% regression signal per hot-path module (user requirement: <5%
          # regression; security never sacrificed). benchstat prints a +N%
          # delta only for statistically significant changes (insignificant
          # ones render as ~), so any +N% line with N > 5 is a real signal.
          # Warning only — shared runners are noisy, so this workflow stays
          # advisory by design (continue-on-error above); follow up on
          # repeated warnings, never gate merges on one sample. No
          # per-request reflection may be introduced by anyone; these numbers
          # watch the trend.
          signal_regressions() {
            base="$1"; head="$2"; label="$3"
            if [ ! -f "$head" ]; then
              echo "no head results for $label, skipping"
              return 0
            fi
            echo "== benchstat $label: $base vs $head"
            benchstat "$base" "$head" > "benchstat-$label.txt" 2>&1 || true
            cat "benchstat-$label.txt"
            grep -E '\+[0-9]+\.[0-9]+%' "benchstat-$label.txt" 2>/dev/null | while IFS= read -r line; do
              delta="$(printf '%s' "$line" | grep -oE '\+[0-9]+\.[0-9]+%' | head -n 1 | tr -d '+%')"
              if awk -v d="$delta" 'BEGIN { exit !(d + 0 > 5.0) }'; then
                echo "::warning::perf regression >5% in $label (+$delta%): $line"
              fi
            done
            return 0
          }
          signal_regressions bench-base-orm.txt bench-orm.txt orm
          signal_regressions bench-base-container.txt bench-container.txt container
          exit 0
