name: bench

# Non-gating benchmark trend for orm + container hot paths. This workflow
# NEVER fails a PR: every step that could fail (benchstat compare, artifact
# download for the base) runs with continue-on-error, and the workflow is
# intentionally not listed in required status checks. Read the numbers as
# trend signal; compare shapes (allocs/op) and relative deltas via
# benchstat, not single-run ns/op (see docs benchmarks reference).
#
# Repro locally: go test -run=NONE -bench=. -benchmem -count=6 ./orm/...
# then `benchstat base.txt head.txt` (golang.org/x/perf/cmd/benchstat).

on:
  push:
    branches: [main]
    paths:
      - "orm/**"
      - "container/**"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "orm/**"
      - "container/**"
      - ".github/workflows/bench.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  bench-orm:
    name: bench-orm
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Run orm benchmarks
        run: go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./orm/... 2>&1 | tee bench-orm.txt
      - name: Upload orm results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-orm-${{ github.sha }}
          path: bench-orm.txt
          retention-days: 90

  bench-container:
    name: bench-container
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Run container benchmarks
        run: go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./container/... 2>&1 | tee bench-container.txt
      - name: Upload container results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-container-${{ github.sha }}
          path: bench-container.txt
          retention-days: 90

  benchstat:
    name: benchstat
    runs-on: ubuntu-latest
    needs: [bench-orm, bench-container]
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Download head results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*-${{ github.sha }}
          merge-multiple: true
      - name: Compare with base branch
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          git stash -u || true
          git checkout -q origin/${{ github.base_ref }} -- orm container 2>/dev/null || true
          go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 ./orm/... 2>&1 | tee bench-base.txt || true
          benchstat bench-base.txt bench-orm.txt bench-container.txt || true
