name: bench

# Non-gating benchmark trend for hot paths across module groups.
# This workflow NEVER fails a PR: every step that could fail runs with
# continue-on-error, and the workflow is intentionally not listed in
# required status checks. Read the numbers as trend signal; compare shapes
# (allocs/op) and relative deltas via benchstat, not single-run ns/op.
#
# Module groups rotate daily (deterministic via date) to cover all packages
# within a week without exceeding runner budgets. Each group targets ~3 min.
# Runtime budget: ~10 min total per workflow run (including setup).

on:
  push:
    branches: [main]
    paths:
      - "**/*_bench_test.go"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "**/*_bench_test.go"
      - ".github/workflows/bench.yml"
  schedule:
    # Daily at 06:00 UTC; module group selected by day-of-week.
    - cron: "0 6 * * *"

permissions:
  contents: read

# Module groups for rotation (deterministic via day-of-week 0=Sun..6=Sat).
# Each group kept to ~3 min runtime on ubuntu-24.04 shared runners.
# Add/remove packages here as benchmark coverage expands.
env:
  MODULE_GROUPS: |
    [{"day":0,"modules":["./orm/...","./container/..."],"label":"orm+container"},
     {"day":1,"modules":["./core/...","./config/..."],"label":"core+config"},
     {"day":2,"modules":["./shared/...","./serve/..."],"label":"shared+serve"},
     {"day":3,"modules":["./dsl/...","./tools/apidiff/..."],"label":"dsl+apidiff"},
     {"day":4,"modules":["./tools/tagcheck/...","./tools/vulngate/...","./tools/gengrammar/..."],"label":"tools"},
     {"day":5,"modules":["./adapters/.../noop/..."],"label":"adapters-noop"},
     {"day":6,"modules":["./adapters/.../memory/...","./adapters/.../log/..."],"label":"adapters-memory+log"}]

jobs:
  # Single job: compute today's group once (date -u +%w) and run only it.
  # No matrix fan-out — one runner per workflow run.
  bench-group:
    name: bench-group
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Select module group for today
        id: select
        run: |
          DAY=$(date -u +%w)  # 0=Sun..6=Sat
          echo "day=$DAY" >> $GITHUB_OUTPUT
          # Single selection: pick today's group from MODULE_GROUPS once.
          GROUP=$(printf '%s' "$MODULE_GROUPS" | jq -c --argjson day "$DAY" '[.[] | select(.day == $day)][0]')
          if [ -z "$GROUP" ] || [ "$GROUP" = "null" ]; then
            echo "No group for day $DAY, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            printf '%s' "$GROUP" | jq -r '.modules | join(" ")' > /tmp/modules.txt
            echo "modules=$(cat /tmp/modules.txt)" >> $GITHUB_OUTPUT
            echo "label=$(printf '%s' "$GROUP" | jq -r '.label')" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Run benchmarks
        if: steps.select.outputs.skip != 'true'
        run: |
          modules="${{ steps.select.outputs.modules }}"
          label="${{ steps.select.outputs.label }}"
          echo "Running benchmarks for group: $label"
          echo "Modules: $modules"
          go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 $modules 2>&1 | tee "bench-$label.txt"
      - name: Upload results
        if: steps.select.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ steps.select.outputs.label }}-${{ github.sha }}
          path: bench-${{ steps.select.outputs.label }}.txt
          retention-days: 90

  benchstat:
    name: benchstat-compare
    runs-on: ubuntu-24.04
    needs: [bench-group]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e # x/perf has no tags; pinned pseudo-version
      - name: Download head results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*-${{ github.sha }}
          merge-multiple: true
      - name: Compare with base branch (5% regression signal, non-gating)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          DAY=$(date -u +%w)
          # Map day to label for base comparison
          case $DAY in
            0) LABEL="orm+container" ;;
            1) LABEL="core+config" ;;
            2) LABEL="shared+serve" ;;
            3) LABEL="dsl+apidiff" ;;
            4) LABEL="tools" ;;
            5) LABEL="adapters-noop" ;;
            6) LABEL="adapters-memory+log" ;;
          esac
          HEAD_FILE="bench-$LABEL.txt"
          BASE_FILE="bench-base-$LABEL.txt"
          if [ ! -f "$HEAD_FILE" ]; then
            echo "No head results for $LABEL, skipping comparison"
            exit 0
          fi
          git fetch origin "$BASE_REF" --depth=1 || true
          git stash -u || true
          # Check out the modules for today's group from base
          case $DAY in
            0) MODULES="./orm/... ./container/..." ;;
            1) MODULES="./core/... ./config/..." ;;
            2) MODULES="./shared/... ./serve/..." ;;
            3) MODULES="./dsl/... ./tools/apidiff/..." ;;
            4) MODULES="./tools/tagcheck/... ./tools/vulngate/... ./tools/gengrammar/..." ;;
            5) MODULES="./adapters/.../noop/..." ;;
            6) MODULES="./adapters/.../memory/... ./adapters/.../log/..." ;;
          esac
          git checkout -q "origin/$BASE_REF" -- $MODULES 2>/dev/null || true
          go test -run=NONE -bench=. -benchmem -benchtime=1s -count=6 $MODULES 2>&1 | tee "$BASE_FILE" || true
          git checkout -q HEAD -- $MODULES 2>/dev/null || true
          # 5% regression signal per hot-path module. benchstat prints a +N%
          # delta only for statistically significant changes (insignificant
          # ones render as ~), so any +N% line with N > 5 is a real signal.
          # Warning only — shared runners are noisy, so this workflow stays
          # advisory by design (continue-on-error above); follow up on
          # repeated warnings, never gate merges on one sample.
          signal_regressions() {
            base="$1"; head="$2"; label="$3"
            if [ ! -f "$head" ]; then
              echo "no head results for $label, skipping"
              return 0
            fi
            echo "== benchstat $label: $base vs $head"
            benchstat "$base" "$head" > "benchstat-$label.txt" 2>&1 || true
            cat "benchstat-$label.txt"
            grep -E '\+[0-9]+\.[0-9]+%' "benchstat-$label.txt" 2>/dev/null | while IFS= read -r line; do
              delta="$(printf '%s' "$line" | grep -oE '\+[0-9]+\.[0-9]+%' | head -n 1 | tr -d '+%')"
              if awk -v d="$delta" 'BEGIN { exit !(d + 0 > 5.0) }'; then
                echo "::warning::perf regression >5% in $label (+$delta%): $line"
              fi
            done
            return 0
          }
          signal_regressions "$BASE_FILE" "$HEAD_FILE" "$LABEL"
          exit 0