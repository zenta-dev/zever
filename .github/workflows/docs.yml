name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  pull_request:
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build docs
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && exit 0; echo "npm ci attempt $i failed"; sleep $((i * 10)); done
          exit 1
        working-directory: docs
      # Docs gate: cross-check the published pages against the Go source
      # (env keys, adapter names, container accessors, CLI flags, import
      # paths). It fails the build when a page claims something the code
      # does not do.
      - name: Audit docs claims against the code
        run: npm run audit
        working-directory: docs
      - name: Prove the docs audit rejects the mistakes it guards against
        run: npm run audit:self-test
        working-directory: docs
      # Style lint: report only for now. It flags pre-existing em/en
      # dashes, lowercase "zever", and >2 Asides across pages that predate
      # this workflow, so it cannot gate yet; it runs so the debt stays
      # visible and shrinks over time.
      - name: Lint docs style
        run: npm run lint
        working-directory: docs
        continue-on-error: true
      - name: Build docs
        run: npm run build
        working-directory: docs
      # Internal link check over the built site: report only for now. It
      # finds pre-existing broken relative links in pages that predate this
      # workflow, so it cannot gate yet; the lychee job below covers the
      # external links.
      - name: Check internal links
        run: npm run check-links
        working-directory: docs
        continue-on-error: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    name: deploy to GitHub Pages
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  linkcheck:
    name: lychee link check
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Astro resolves extensionless routed links (e.g. storage-media/
          # for digging-deeper/storage-media.mdx) at build time; lychee
          # checks raw files and cannot map them, so exclude local-file
          # URIs and let lychee guard http(s) links only.
          args: --verbose --no-progress --exclude '^file://' 'docs/**/*.md*'
