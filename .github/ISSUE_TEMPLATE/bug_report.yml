name: Bug report
description: Report a reproducible bug in zever
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough information to reproduce it.
        Before filing, search [existing issues](https://github.com/zenta-dev/zever/issues) to avoid duplicates.

        **Remove any secrets, API keys, credentials, tokens, or private information from the report.**

  - type: input
    id: version
    attributes:
      label: zever version
      description: The version or commit you are using, e.g. v0.1.0 or the git revision.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
      placeholder: go version go1.27.0 linux/amd64
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Linux, macOS, Windows. Include the architecture if relevant, e.g. linux/amd64.
      placeholder: Linux 6.x (amd64)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? Why is the current behavior incorrect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smallest program or test that reproduces the issue. Should be a self-contained Go snippet where possible.
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Relevant output, logs, or stack traces. Omit anything sensitive.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that may help, such as configuration, environment details, or performance characteristics.