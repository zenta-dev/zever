syntax = "proto3";

package zever.v1;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "zever/annotations.proto";

option go_package = "github.com/zenta-dev/zever/gen/zeverv1;zeverv1";

message User {
  string id = 1;
  string email = 2;
  string password_hash = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Space {
  string id = 1;
  string host_id = 2;
  string title = 3;
  string description = 4;
  double lat = 5;
  double lng = 6;
  int64 price_cents = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Booking {
  string id = 1;
  string space_id = 2;
  string guest_id = 3;
  string start_date = 4;
  string end_date = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Review {
  string id = 1;
  string space_id = 2;
  string guest_id = 3;
  int64 rating = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateSpaceRequest {
  string title = 1;
  string description = 2;
  double lat = 3;
  double lng = 4;
  int64 price_cents = 5;
}

message ListSpacesRequest {
}

message GetSpaceRequest {
  string id = 1;
}

message CreateBookingRequest {
  string space_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message CancelBookingRequest {
  string id = 1;
}

message AddReviewRequest {
  string space_id = 1;
  int64 rating = 2;
  string body = 3;
}

service BookingService {
  rpc CreateSpace(CreateSpaceRequest) returns (Space) {
    option (google.api.http) = { post: "/spaces" body: "*" };
    option (zever.annotations.v1.auth) = { required: true };
  }

  rpc ListSpaces(ListSpacesRequest) returns (Space) {
    option (google.api.http) = { get: "/spaces" };
    option (zever.annotations.v1.auth) = { required: true };
  }

  rpc GetSpace(GetSpaceRequest) returns (Space) {
    option (google.api.http) = { get: "/spaces/{id}" };
    option (zever.annotations.v1.auth) = { required: true };
  }

  rpc CreateBooking(CreateBookingRequest) returns (Booking) {
    option (google.api.http) = { post: "/bookings" body: "*" };
    option (zever.annotations.v1.auth) = { required: true };
  }

  rpc CancelBooking(CancelBookingRequest) returns (Booking) {
    option (google.api.http) = { delete: "/bookings/{id}" };
    option (zever.annotations.v1.auth) = { required: true };
    option (zever.annotations.v1.permission) = { check: "booking.cancel", resource: "Booking", owner_field: "guest_id" };
  }

  rpc AddReview(AddReviewRequest) returns (Review) {
    option (google.api.http) = { post: "/reviews" body: "*" };
    option (zever.annotations.v1.auth) = { required: true };
  }
}
