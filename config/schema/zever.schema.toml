additionalProperties = false
type = 'object'

['$defs'.aiOptions.properties]
['$defs'.aiOptions.properties.api_key]
type = 'string'

['$defs'.aiOptions.properties.base_url]
description = 'Must be a valid https URL when set.'
type = 'string'

['$defs'.aiOptions.properties.model]
type = 'string'

['$defs'.aiOptions.properties.timeout]
'$ref' = '#/$defs/durationNs'

